services:
  - type: web
    name: medistock-licensing-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LICENSE_SECRET_SALT
        generateValue: true
    disk:
      name: license-data
      mountPath: /app/data
      sizeGB: 1
